<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720">
  <defs>
    <linearGradient id="blade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a4bd6"/><stop offset=".55" stop-color="#e9dcff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdbcff"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1458"/><stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- chain hanging between the two pommels -->
  <path d="M168 232 Q 280 410 392 232" fill="none" stroke="#c9b8ff" stroke-width="3" stroke-dasharray="7 4" opacity=".85"/>

  <!-- LEFT cleaver (raised, angled out) -->
  <g filter="url(#glow)">
    <path d="M168 238 L96 52 Q 88 30 108 36 Q 150 70 196 190 L186 246 Z" fill="url(#blade)" stroke="#ff4fd8" stroke-width="2.2"/>
    <path d="M110 44 Q 148 90 184 200" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  </g>
  <rect x="160" y="228" width="34" height="14" rx="3" transform="rotate(-18 177 235)" fill="#ffc93c" stroke="#7a4bd6" stroke-width="1.5"/>
  <circle cx="168" cy="244" r="9" fill="none" stroke="#ffc93c" stroke-width="3"/>

  <!-- RIGHT cleaver -->
  <g filter="url(#glow)">
    <path d="M392 238 L464 52 Q 472 30 452 36 Q 410 70 364 190 L374 246 Z" fill="url(#blade)" stroke="#ff4fd8" stroke-width="2.2"/>
    <path d="M450 44 Q 412 90 376 200" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  </g>
  <rect x="366" y="228" width="34" height="14" rx="3" transform="rotate(18 383 235)" fill="#ffc93c" stroke="#7a4bd6" stroke-width="1.5"/>
  <circle cx="392" cy="244" r="9" fill="none" stroke="#ffc93c" stroke-width="3"/>

  <!-- ROOF (peak he stands on) -->
  <path d="M280 596 L560 720 L0 720 Z" fill="url(#roof)" stroke="#ff2d55" stroke-width="2.4"/>
  <path d="M280 596 L190 636 M280 596 L370 636 M280 612 L120 686 M280 612 L440 686" stroke="#ff4fd8" stroke-width="1.2" opacity=".5" fill="none"/>
  <path d="M262 598 Q 280 570 298 598 Z" fill="#1a0b3d" stroke="#ffc93c" stroke-width="1.6"/>

  <!-- BODY silhouette -->
  <g fill="#09040f" stroke="#ff4fd8" stroke-width="2.2" stroke-linejoin="round" filter="url(#glow)">
    <!-- legs, wide stance -->
    <path d="M254 440 L238 598 L262 600 L276 470 L284 470 L298 600 L322 598 L306 440 Z"/>
    <!-- hakama flare -->
    <path d="M246 420 L228 500 L254 480 L280 520 L306 480 L332 500 L314 420 Z"/>
    <!-- torso -->
    <path d="M212 276 Q 280 248 348 276 Q 334 340 318 372 L312 428 L248 428 L242 372 Q 226 340 212 276 Z"/>
    <!-- arms raised to the pommels -->
    <path d="M218 282 L186 270 L168 242 L180 224 L206 236 L242 256 Z"/>
    <path d="M342 282 L374 270 L392 242 L380 224 L354 236 L318 256 Z"/>
    <!-- neck + head -->
    <path d="M268 262 L292 262 L290 238 L270 238 Z"/>
    <ellipse cx="280" cy="216" rx="25" ry="28"/>
  </g>
  <!-- shoulder guards -->
  <path d="M216 272 Q 224 250 246 260 L238 282 Z M344 272 Q 336 250 314 260 L322 282 Z" fill="#3a1a7a" stroke="#ffc93c" stroke-width="1.6"/>
  <!-- wrist guards glow -->
  <rect x="172" y="238" width="22" height="9" rx="3" fill="#ff2d55" transform="rotate(-30 183 242)"/>
  <rect x="366" y="238" width="22" height="9" rx="3" fill="#ff2d55" transform="rotate(30 377 242)"/>

  <!-- HAIR: spiky white -->
  <path d="M254 196 L238 150 L262 176 L270 136 L284 172 L304 138 L304 178 L330 156 L312 204 Q 280 180 254 196 Z" fill="url(#hair)" stroke="#e9dcff" stroke-width="1.2" filter="url(#glow)"/>
  <!-- jewelled headband -->
  <path d="M255 198 Q 280 186 305 198" fill="none" stroke="#ffc93c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="280" cy="191" r="5" fill="#ff2d55" stroke="#ffe9a8" stroke-width="1.5"/>
  <path d="M258 200 L252 226 M302 200 L308 226" stroke="#ffc93c" stroke-width="2.2"/>
  <circle cx="252" cy="230" r="3.5" fill="#3ea6ff"/><circle cx="308" cy="230" r="3.5" fill="#3ea6ff"/>
</svg>
